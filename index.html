<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14040a">
<title>БЕЛБЭТ — Casino</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#10131d;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:min(1100px,94%);
    margin:auto;
}

header{
    background:#191e2b;
    border-bottom:1px solid #34394a;
    padding:20px 0;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#ffd54a;
}

button{
    cursor:pointer;
    font-weight:bold;
}

.balance{
    background:#0c0206;
    border:2px solid #ffd54a;
    color:#ffd54a;
    border-radius:30px;
    padding:12px 20px;
    font-size:19px;
}

main{padding:30px 0}

.title{
    text-align:center;
    color:#ffd54a;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

.casino{
    padding:22px;
    border:2px solid #98751d;
    border-radius:24px;
    background:radial-gradient(#4a0d1a,#14040a 75%);
    box-shadow:0 0 35px #ffd54a22;
}

.machines{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin-bottom:25px;
}

.machine{
    padding:14px 7px;
    border:1px solid #765313;
    border-radius:13px;
    background:#240a12;
    color:#ffe6a0;
    font-size:13px;
    min-height:90px;
}

.machine span{
    display:block;
    font-size:27px;
    margin-bottom:6px;
}

.machine.active{
    background:linear-gradient(#ffd54a,#b8860b);
    color:#260d00;
}

.stage{
    padding:22px 12px;
    border:3px solid #c9a227;
    border-radius:20px;
    background:linear-gradient(150deg,#5a060e,#14040a);
    text-align:center;
}

.machine-name{
    color:#ffe18a;
    font-size:25px;
    margin:5px 0 20px;
}

.reels{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px auto;
}

.reel{
    width:clamp(65px,15vw,105px);
    height:clamp(80px,18vw,120px);
    display:grid;
    place-items:center;
    background:linear-gradient(#ddd,#fff,#ddd);
    border:3px solid #ffd54a;
    border-radius:13px;
    font-size:clamp(35px,8vw,65px);
    color:#111;
}

.reel.spin{
    animation:shake .12s infinite;
    filter:blur(2px);
}

@keyframes shake{
    50%{transform:translateY(5px)}
}

.reel.win{
    box-shadow:0 0 25px 8px #ffd54a;
    animation:pulse .5s infinite alternate;
}

@keyframes pulse{
    to{transform:scale(1.08)}
}

.message{
    min-height:35px;
    font-size:20px;
    font-weight:bold;
    color:#ffd54a;
}

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:15px;
}

.play{
    padding:16px 40px;
    border:0;
    border-radius:40px;
    background:linear-gradient(#ff5555,#b90018);
    color:white;
    font-size:20px;
    box-shadow:0 5px #69000b;
}

.play:active{transform:translateY(4px)}

.play:disabled{opacity:.5}

.info{
    margin-top:20px;
    padding:15px;
    background:#14040a;
    border-radius:12px;
    color:#e9d6a0;
    font-size:13px;
    line-height:1.8;
}

.history{
    margin-top:25px;
    padding:18px;
    background:#191e2b;
    border:1px solid #34394a;
    border-radius:16px;
}

.history h3{color:#ffd54a}

.history-item{
    padding:9px 0;
    border-bottom:1px solid #34394a;
    color:#ddd;
    font-size:13px;
}

.reset{
    background:#34394a;
    color:white;
    padding:10px 18px;
    border:0;
    border-radius:10px;
}

footer{
    text-align:center;
    color:#777;
    padding:30px;
    font-size:12px;
}

@media(max-width:500px){
    .casino{padding:12px}
    .machines{grid-template-columns:repeat(3,1fr)}
    .machine{font-size:11px}
}
</style>
</head>

<body>

<header>
<div class="container header">
    <div class="logo">✦ БЕЛБЭТ CASINO</div>
    <div class="balance">🪙 <span id="balance">1000</span></div>
</div>
</header>

<main class="container">

<h1 class="title">🎰 ИГРОВАЯ ЗОНА</h1>
<p class="subtitle">15 тематических игровых автоматов</p>

<div class="casino">

<div class="machines" id="machines"></div>

<div class="stage">

<h2 class="machine-name" id="machineName"></h2>

<div class="reels" id="reels"></div>

<div class="message" id="message">
Выбери автомат!
</div>

<div class="controls">
<button class="play" id="play">ИГРАТЬ</button>
</div>

<div class="info" id="info"></div>

</div>
</div>

<div class="history">
<h3>📜 Последние результаты</h3>
<div id="history">Пока нет результатов</div>
<br>
<button class="reset" id="reset">Сбросить прогресс</button>
</div>

</main>

<footer>
© 2026 БЕЛБЭТ · Виртуальная игровая зона
</footer>

<script>
"use strict";

// Все автоматы

const games = [

{
name:"Фруктовая классика",
icon:"🍒",
symbols:["🍒","🍋","🍊","🍇","🔔","⭐","7️⃣"],
weights:[30,25,20,12,7,4,2],
reels:3
},

{
name:"Золото фараонов",
icon:"👑",
symbols:["🪲","🐍","👁️","🏺","🔱","👑"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Космический джекпот",
icon:"🚀",
symbols:["☄️","🪐","🌟","👽","🚀","💎"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Алмазная лихорадка",
icon:"💎",
symbols:["💠","🔷","🔹","💎","👑","💍"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Пиратские сокровища",
icon:"🏴‍☠️",
symbols:["⚓","🦜","🗺️","💰","🏴‍☠️","💎"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Драконье золото",
icon:"🐉",
symbols:["🔥","🥚","🐲","🛡️","👑","🐉"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Лесная магия",
icon:"🌲",
symbols:["🍄","🦊","🦉","🌳","🧚","🌟"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Вампирская ночь",
icon:"🧛",
symbols:["🦇","🌙","🕯️","🧛","🩸","💎"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Удачливая панда",
icon:"🐼",
symbols:["🎋","🐼","🥟","🎍","⭐","👑"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Огненная гора",
icon:"🌋",
symbols:["🔥","🌋","🪨","☄️","💥","💎"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Золотой дворец",
icon:"🏛️",
symbols:["🏛️","🏺","🪙","👑","💍","💎"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Подводный мир",
icon:"🌊",
symbols:["🐠","🐙","🦈","🐬","🧜","💎"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Электрический шторм",
icon:"⚡",
symbols:["⚡","🔋","🌩️","💡","🔥","💎"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Дикий запад",
icon:"🤠",
symbols:["🤠","🐎","⭐","🔫","💰","👑"],
weights:[30,26,20,14,7,3],
reels:5
},

{
name:"Королевский джекпот",
icon:"👑",
symbols:["♠️","♥️","♦️","♣️","💍","👑"],
weights:[30,26,20,14,7,3],
reels:5
}

];

// Настройки игровых наград.
// Это игровые очки, а не реальные казино-выплаты.

const rewards = {
3:10,
4:30,
5:100
};

let balance = 1000;
let current = 0;
let busy = false;
let history = [];

try{
    balance = Number(localStorage.getItem("bb_balance")) || 1000;
    history = JSON.parse(localStorage.getItem("bb_history") || "[]");
}catch(e){}

const $ = id => document.getElementById(id);

function save(){
    try{
        localStorage.setItem("bb_balance",balance);
        localStorage.setItem("bb_history",JSON.stringify(history));
    }catch(e){}
}

function updateBalance(){
    $("balance").textContent=balance.toLocaleString("ru-RU");
    save();
}

// Создание кнопок автоматов

games.forEach((g,i)=>{

    const b=document.createElement("button");

    b.className="machine";
    b.innerHTML=`<span>${g.icon}</span>${g.name}`;

    b.onclick=()=>selectGame(i);

    $("machines").appendChild(b);

});

function selectGame(i){

    if(busy)return;

    current=i;

    document.querySelectorAll(".machine").forEach((b,n)=>{
        b.classList.toggle("active",n===i);
    });

    const g=games[i];

    $("machineName").textContent=g.icon+" "+g.name+" "+g.icon;

    $("reels").innerHTML=Array.from(
        {length:g.reels},
        ()=>'<div class="reel">❔</div>'
    ).join("");

    $("message").textContent="Готов к игре!";

    $("info").innerHTML=`
        <b>Автомат:</b> ${g.name}<br>
        <b>Барабаны:</b> ${g.reels}<br>
        <b>Символов:</b> ${g.symbols.length}<br>
        <b>Режим:</b> виртуальные игровые очки
    `;
}

// Случайный выбор символа с заданными весами

function pick(g){

    let total=g.weights.reduce((a,b)=>a+b,0);

    let r=Math.random()*total;

    for(let i=0;i<g.weights.length;i++){

        r-=g.weights[i];

        if(r<0)return g.symbols[i];

    }

    return g.symbols[0];
}

// Игровой раунд

function play(){

    if(busy)return;

    busy=true;

    $("play").disabled=true;

    const g=games[current];

    const reels=[...document.querySelectorAll(".reel")];

    $("message").textContent="✨ Играем...";

    reels.forEach(r=>{
        r.classList.remove("win");
        r.classList.add("spin");
    });

    const result=Array.from(
        {length:g.reels},
        ()=>pick(g)
    );

    // Анимация

    reels.forEach((r,i)=>{

        let count=0;

        const interval=setInterval(()=>{

            r.textContent=pick(g);

        },75);

        const duration=1000+i*450;

        setTimeout(()=>{

            clearInterval(interval);

            r.classList.remove("spin");

            r.textContent=result[i];

            count++;

            if(i===reels.length-1){

                setTimeout(()=>finish(result,reels),200);

            }

        },duration);

    });

}

function finish(result,reels){

    const counts={};

    result.forEach(s=>{
        counts[s]=(counts[s]||0)+1;
    });

    const best=Math.max(...Object.values(counts));

    const g=games[current];

    let points=0;

    if(best>=3){
        points=rewards[best]||0;
    }

    if(points>0){

        balance+=points;

        result.forEach((s,i)=>{

            if(counts[s]===best){
                reels[i].classList.add("win");
            }

        });

        $("message").textContent=
            "🎉 КОМБИНАЦИЯ! +"+points+" 🪙";

    }else{

        $("message").textContent=
            "✨ Попробуй другую комбинацию!";

    }

    updateBalance();

    addHistory(g.name,result,points);

    busy=false;

    $("play").disabled=false;

}

function addHistory(name,result,points){

    history.unshift({
        name,
        result:result.join(" "),
        points,
        time:new Date().toLocaleTimeString("ru-RU")
    });

    history=history.slice(0,20);

    renderHistory();

    save();

}

function renderHistory(){

    if(!history.length){
        $("history").textContent="Пока нет результатов";
        return;
    }

    $("history").innerHTML=history.map(h=>`

        <div class="history-item">

            ${h.time} · ${h.name}<br>

            ${h.result}

            <b style="color:#ffd54a">
                ${h.points>0?" +"+h.points+" 🪙":" "}
            </b>

        </div>

    `).join("");

}

// Кнопки

$("play").onclick=play;

$("reset").onclick=()=>{

    if(busy)return;

    if(!confirm("Сбросить игровой прогресс?"))return;

    balance=1000;

    history=[];

    updateBalance();

    renderHistory();

};

selectGame(0);

updateBalance();

renderHistory();

</script>

</body>
</html>
