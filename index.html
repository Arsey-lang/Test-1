<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Поезд</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #dfe5eb;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Основная область */

        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 500px;
            overflow: hidden;
            background:
                linear-gradient(
                    to bottom,
                    #87ceeb 0%,
                    #cceeff 55%,
                    #b7c0c8 55%,
                    #b7c0c8 100%
                );
        }

        /* Облака */

        .cloud {
            position: absolute;
            width: 130px;
            height: 45px;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud::before {
            width: 55px;
            height: 55px;
            left: 20px;
            bottom: 10px;
        }

        .cloud::after {
            width: 70px;
            height: 70px;
            right: 15px;
            bottom: 5px;
        }

        .cloud.one {
            top: 80px;
            left: 10%;
        }

        .cloud.two {
            top: 140px;
            left: 65%;
            transform: scale(0.7);
        }

        /* Железная дорога */

        .railway {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 90px;
            height: 220px;
        }

        /* Шпалы */

        .sleepers {
            position: absolute;
            left: -50px;
            right: -50px;
            top: 105px;
            height: 75px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #654321 0px,
                    #654321 12px,
                    transparent 12px,
                    transparent 55px
                );

            transform: perspective(400px) rotateX(25deg);
        }

        /* Основные рельсы */

        .rail {
            position: absolute;
            left: 0;
            width: 100%;
            height: 7px;
            background: #4b4b4b;
            border-radius: 5px;
            z-index: 2;
        }

        .rail.top {
            top: 100px;
        }

        .rail.bottom {
            top: 155px;
        }

        /* Рельс, на который переходит поезд */

        .switch-rail {
            position: absolute;
            left: 40%;
            top: 155px;
            width: 65%;
            height: 7px;

            background: #4b4b4b;
            border-radius: 5px;

            transform-origin: left center;
            transform: rotate(-11deg);

            z-index: 2;
        }

        /* Вторая направляющая */

        .switch-rail.second {
            top: 100px;
            transform: rotate(11deg);
        }

        /* Поезд */

        .train {
            position: absolute;

            left: -220px;
            top: 55px;

            width: 180px;
            height: 85px;

            background: #e53935;

            border-radius: 12px 20px 8px 8px;

            z-index: 10;

            animation: none;
        }

        /* Передняя часть */

        .train::before {
            content: "";

            position: absolute;

            right: -25px;
            top: 25px;

            width: 30px;
            height: 45px;

            background: #c62828;

            border-radius: 0 12px 8px 0;
        }

        /* Окна */

        .window {
            position: absolute;

            top: 13px;

            width: 36px;
            height: 28px;

            background: #bdefff;

            border: 4px solid #333;

            border-radius: 5px;
        }

        .window.one {
            left: 18px;
        }

        .window.two {
            left: 68px;
        }

        .window.three {
            left: 118px;
        }

        /* Колёса */

        .wheel {
            position: absolute;

            bottom: -17px;

            width: 34px;
            height: 34px;

            background: #222;

            border: 6px solid #555;

            border-radius: 50%;

            animation: wheelRotate 0.25s linear infinite paused;
        }

        .wheel::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            left: 7px;
            top: 7px;

            background: #aaa;

            border-radius: 50%;
        }

        .wheel.left {
            left: 25px;
        }

        .wheel.right {
            right: 25px;
        }

        /* Фара */

        .lamp {
            position: absolute;

            right: -20px;
            top: 45px;

            width: 12px;
            height: 12px;

            background: #fff59d;

            border-radius: 50%;

            box-shadow:
                0 0 15px #fff,
                0 0 30px #fff59d;
        }

        /* Кнопка */

        .start-button {
            position: absolute;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            padding: 14px 30px;

            border: none;
            border-radius: 10px;

            background: #1976d2;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.15s,
                background 0.15s;
        }

        .start-button:hover {
            background: #1565c0;
            transform: translateX(-50%) scale(1.05);
        }

        .start-button:active {
            transform: translateX(-50%) scale(0.97);
        }

        /* Анимация поезда */

        .train.run {
            animation: trainMove 8s linear forwards;
        }

        /* Анимация колёс */

        .train.run .wheel {
            animation-play-state: running;
        }

        @keyframes wheelRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Поезд едет прямо,
           затем переходит на новую ветку */

        @keyframes trainMove {

            0% {
                left: -220px;
                top: 55px;
                transform: rotate(0deg);
            }

            30% {
                left: 25%;
                top: 55px;
                transform: rotate(0deg);
            }

            45% {
                left: 42%;
                top: 48px;
                transform: rotate(-5deg);
            }

            60% {
                left: 57%;
                top: 25px;
                transform: rotate(-11deg);
            }

            75% {
                left: 72%;
                top: 0px;
                transform: rotate(-11deg);
            }

            100% {
                left: calc(100% + 220px);
                top: -20px;
                transform: rotate(-11deg);
            }
        }

        /* Телефон */

        @media (max-width: 600px) {

            .scene {
                min-height: 450px;
            }

            .train {
                transform: scale(0.75);
                transform-origin: left center;
            }

            .railway {
                bottom: 90px;
            }

            .start-button {
                font-size: 16px;
                padding: 12px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="scene">

        <!-- Облака -->

        <div class="cloud one"></div>
        <div class="cloud two"></div>

        <!-- Железная дорога -->

        <div class="railway">

            <div class="sleepers"></div>

            <div class="rail top"></div>
            <div class="rail bottom"></div>

            <!-- Переключение на новую ветку -->

            <div class="switch-rail"></div>
            <div class="switch-rail second"></div>

            <!-- Поезд -->

            <div class="train" id="train">

                <div class="window one"></div>
                <div class="window two"></div>
                <div class="window three"></div>

                <div class="lamp"></div>

                <div class="wheel left"></div>
                <div class="wheel right"></div>

            </div>

        </div>

        <!-- Кнопка запуска -->

        <button
            class="start-button"
            id="startButton"
            onclick="startTrain()">
            🚆 Запустить поезд
        </button>

    </div>

    <script>

        function startTrain() {

            const train = document.getElementById("train");
            const button = document.getElementById("startButton");

            /*
             * Сбрасываем анимацию,
             * чтобы поезд можно было запускать
             * сколько угодно раз.
             */

            train.classList.remove("run");

            void train.offsetWidth;

            train.classList.add("run");

            button.textContent = "🚆 Поезд едет...";

            setTimeout(function () {
                button.textContent = "🚆 Запустить поезд";
            }, 8000);
        }

    </script>

</body>
</html>
