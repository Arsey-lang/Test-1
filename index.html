<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14040a">
<title>БЕЛБЭТ — Casino</title>
<style>
*{box-sizing:border-box}
:root{--ch:clamp(50px,11vw,80px);--cw:clamp(54px,14vw,92px)}
body{margin:0;background:#10131d;color:#fff;font-family:Arial,sans-serif}
.container{width:min(1100px,94%);margin:auto}
header{background:#191e2b;border-bottom:1px solid #34394a;padding:16px 0}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-size:22px;font-weight:900;color:#ffd54a}
.right{display:flex;gap:8px;align-items:center}
button{cursor:pointer;font-weight:bold;font-family:inherit}
.balance{background:#0c0206;border:2px solid #ffd54a;color:#ffd54a;border-radius:30px;padding:10px 18px;font-size:18px}
.balance.bad{animation:shake .12s 4}
.icon{background:#0c0206;border:2px solid #98751d;color:#ffd54a;border-radius:50%;width:42px;height:42px;font-size:18px}
main{padding:26px 0}
.title{text-align:center;color:#ffd54a;font-size:28px;margin:0 0 6px}
.subtitle{text-align:center;color:#aaa;margin:0 0 22px}
.casino{padding:20px;border:2px solid #98751d;border-radius:24px;background:radial-gradient(#4a0d1a,#14040a 75%);box-shadow:0 0 35px #ffd54a22}
.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.machine{padding:12px 6px;border:1px solid #765313;border-radius:13px;background:#240a12;color:#ffe6a0;font-size:13px;min-height:84px}
.machine span{display:block;font-size:26px;margin-bottom:5px}
.machine.active{background:linear-gradient(#ffd54a,#b8860b);color:#260d00}
.machine.wheelm{border-color:#ffd54a;background:#2c1030}
.machine small{display:block;color:#ffd54a;margin-top:3px}
.stage{padding:20px 10px;border:3px solid #c9a227;border-radius:20px;background:linear-gradient(150deg,#5a060e,#14040a);text-align:center}
.machine-name{color:#ffe18a;font-size:24px;margin:4px 0 16px}
.reels{display:flex;justify-content:center;gap:6px;margin:14px auto;padding:10px;background:#0c0206;border:2px solid #c9a227;border-radius:16px;width:fit-content;max-width:100%}
.reel{width:var(--cw);height:calc(var(--ch)*3);overflow:hidden;background:linear-gradient(#bbb,#fff 25%,#fff 75%,#bbb);border:2px solid #ffd54a;border-radius:10px}
.cell{height:var(--ch);display:grid;place-items:center;font-size:calc(var(--ch)*.6);color:#111;border-bottom:1px solid #0001}
